# Render Blueprint for consumeit.in
#
# Applies the security headers documented in SECURITY.md. Render reads this file
# for Blueprint-managed services. If this site was created manually through the
# Render dashboard, either connect it as a Blueprint or copy the header rules
# below into  Dashboard → your static site → Settings → Headers.
services:
  - type: web
    runtime: static
    name: consumeit
    staticPublishPath: .

    headers:
      # ---- Applied to every response -------------------------------------
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload

      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      - path: /*
        name: X-Frame-Options
        value: DENY

      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      - path: /*
        name: Permissions-Policy
        value: >-
          accelerometer=(), autoplay=(), camera=(), display-capture=(),
          encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(),
          magnetometer=(), microphone=(), midi=(), payment=(), usb=(),
          xr-spatial-tracking=(), interest-cohort=()

      # ---- Content Security Policy ---------------------------------------
      # 'unsafe-inline' is required for style-src ONLY: the pages use inline
      # style attributes (e.g. progress-bar widths). No inline <script> exists,
      # so script-src stays strict.
      #
      # Google/Meta/Clarity origins are listed because assets/js/config.js can
      # switch those vendors on. Remove any you will never use. If you set
      # `formEndpoint` in config.js, add that origin to connect-src.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          base-uri 'self';
          object-src 'none';
          frame-ancestors 'none';
          form-action 'self';
          script-src 'self' https://www.googletagmanager.com
            https://www.google-analytics.com https://connect.facebook.net
            https://www.clarity.ms https://*.clarity.ms;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data: https://www.google-analytics.com
            https://www.googletagmanager.com https://www.facebook.com
            https://*.clarity.ms;
          connect-src 'self' https://www.google-analytics.com
            https://*.google-analytics.com https://*.analytics.google.com
            https://www.googletagmanager.com https://*.clarity.ms;
          upgrade-insecure-requests

      # ---- Caching --------------------------------------------------------
      # Fingerprint these filenames (site.abc123.css) before lengthening this.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800, stale-while-revalidate=86400

      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
