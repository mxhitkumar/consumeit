{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="breadcrumb-wrapper bg-cover" style="background-image: url('{% static 'assets/img/breadcrumb.jpg' %}');">
    <div class="container">
        <div class="page-heading">
            <div class="breadcrumb-sub-title">
                <h1 class="wow fadeInUp" data-wow-delay=".3s">Our Faq</h1>
            </div>
            <ul class="breadcrumb-items wow fadeInUp" data-wow-delay=".5s">
                <li>
                    <a href="{% url 'pages:home' %}">
                        <i class="fa-regular fa-house"></i>
                        Home
                    </a>
                </li>
                <li><i class="fa-solid fa-slash-forward"></i></li>
                <li>Our Faq</li>
            </ul>
        </div>
    </div>
</div>

<section class="faq-section fix section-padding">
    <div class="container">
        <div class="faq-wrapper">
            <div class="row g-4 align-items-center">
                <div class="col-lg-6">
                    <div class="faq-image">
                        <img src="{% static 'assets/img/faq.jpg' %}" alt="Frequently asked questions">
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="faq-content">
                        <h2>Frequently Asked Questions</h2>
                        <div class="faq-accordion-items">
                            <div class="faq-accordion">
                                <div class="accordion" id="accordion">
                                    {% for faq in faqs %}
                                    <div class="accordion-item {% if forloop.last %}mb-0{% endif %} wow fadeInUp" data-wow-delay=".{{ forloop.counter|add:2 }}s">
                                        <h5 class="accordion-header">
                                            <button class="accordion-button {% if not forloop.first %}collapsed{% endif %}" type="button"
                                                data-bs-toggle="collapse" data-bs-target="#faq{{ forloop.counter }}"
                                                aria-expanded="{% if forloop.first %}true{% else %}false{% endif %}" aria-controls="faq{{ forloop.counter }}">
                                                {{ faq.question }}
                                            </button>
                                        </h5>
                                        <div id="faq{{ forloop.counter }}" class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" data-bs-parent="#accordion">
                                            <div class="accordion-body">
                                                {{ faq.answer|safe }}
                                            </div>
                                        </div>
                                    </div>
                                    {% endfor %}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="cta-section fix section-padding pt-0 dark-bg-style black-bg">
    <div class="container">
        <div class="cta-wrapper bg-cover" style="background-image: url('{% static 'assets/img/cta/cta-bg.jpg' %}');">
            <h2 class="wow fadeInUp" data-wow-delay=".3s">Have an idea in your mind?Let’s make something great together</h2>
            <a href="{% url 'cms:page-detail' slug='contact' %}" class="theme-btn border-white wow fadeInUp" data-wow-delay=".5s">
                <span class="icon-1">
                    <img src="{% static 'assets/img/icon/10.svg' %}" alt="Arrow icon">
                </span>
                get in touch
                <span class="icon-2">
                    <img src="{% static 'assets/img/icon/11.svg' %}" alt="Arrow icon">
                </span>
            </a>
        </div>
    </div>
</section>
{% endblock %}
